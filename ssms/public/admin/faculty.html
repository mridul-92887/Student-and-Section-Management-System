<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title">Faculty</h1>

    <div class="card">
      <h2>Add Faculty Member</h2>
      <form id="add-form">
        <div class="form-grid">
          <div><label>Name</label><input type="text" name="faculty_name" required></div>
          <div><label>Email</label><input type="email" name="email" required></div>
          <div><label>Designation</label><input type="text" name="designation"></div>
          <div>
            <label>Department</label>
            <select name="department_id" id="add-department"></select>
          </div>
        </div>
        <button type="submit" class="btn">Add Faculty</button>
      </form>
    </div>

    <div class="card">
      <h2>All Faculty</h2>
      <div id="table-wrap"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-faculty.js"></script>
</body>
</html>
