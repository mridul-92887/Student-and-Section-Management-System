<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title">Courses</h1>

    <div class="card">
      <h2>Add Course</h2>
      <form id="add-form">
        <div class="form-grid">
          <div><label>Course Code</label><input type="text" name="course_code" required placeholder="e.g. CSE-415"></div>
          <div><label>Course Title</label><input type="text" name="course_title" required></div>
          <div><label>Credit</label><input type="number" step="0.5" name="credit" required></div>
          <div><label>Department</label><select name="department_id" id="add-department"></select></div>
          <div><label>Assigned Teacher</label><select name="faculty_id" id="add-faculty"></select></div>
        </div>
        <button type="submit" class="btn">Add Course</button>
      </form>
    </div>

    <div class="card">
      <h2>All Courses</h2>
      <div id="table-wrap"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-courses.js"></script>
</body>
</html>
