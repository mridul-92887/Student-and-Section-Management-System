<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sections | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title">Sections</h1>

    <div class="card">
      <h2>Add Section</h2>
      <form id="add-form">
        <div class="form-grid">
          <div><label>Section Name</label><input type="text" name="section_name" required placeholder="e.g. CSE-61-A"></div>
          <div><label>Capacity</label><input type="number" name="capacity" value="40" min="1" required></div>
          <div><label>Department</label><select name="department_id" id="add-department"></select></div>
          <div><label>Faculty Advisor</label><select name="faculty_id" id="add-faculty"></select></div>
        </div>
        <button type="submit" class="btn">Add Section</button>
      </form>
    </div>

    <div class="card">
      <h2>All Sections</h2>
      <div id="table-wrap"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-sections.js"></script>
</body>
</html>
