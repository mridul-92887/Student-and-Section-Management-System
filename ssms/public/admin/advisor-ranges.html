<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisor ID Ranges | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title">Advisor ID Ranges</h1>
    <p style="color:#6b7280; margin-bottom:16px;">
      Each advisor can only add students whose ID falls inside a range you assign here.
      An advisor with no range assigned cannot add any students.
    </p>

    <div class="card">
      <h2>Assign a Range</h2>
      <div id="assign-wrap"></div>
    </div>

    <div class="card">
      <h2>Current Assignments</h2>
      <div id="table-wrap"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-advisor-ranges.js"></script>
</body>
</html>
