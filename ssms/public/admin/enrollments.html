<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollments | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title">Enrollments</h1>

    <div class="card">
      <h2>Enroll a Student in a Course</h2>
      <form id="add-form">
        <div class="form-grid">
          <div><label>Student</label><select name="student_id" id="add-student" required></select></div>
          <div><label>Course</label><select name="course_id" id="add-course" required></select></div>
          <div>
            <label>Semester</label>
            <select name="semester" required>
              <option value="Spring">Spring</option>
              <option value="Summer">Summer</option>
              <option value="Fall">Fall</option>
            </select>
          </div>
          <div><label>Academic Year</label><input type="number" name="academic_year" value="2026" required></div>
        </div>
        <button type="submit" class="btn">Add Enrollment</button>
      </form>
    </div>

    <div class="card">
      <h2>All Enrollments</h2>
      <div id="table-wrap"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-enrollments.js"></script>
</body>
</html>
