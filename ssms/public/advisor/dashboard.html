<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisor Dashboard | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="flash-container"></div>
    <h1 class="page-title" id="welcome-title">Welcome</h1>

    <div class="card">
      <h2>My Assigned Student ID Range(s)</h2>
      <div id="ranges-wrap"></div>
    </div>

    <div class="card">
      <h2>My Advised Sections &mdash; Capacity Utilization</h2>
      <div id="sections-wrap"></div>
    </div>

    <div class="card" id="add-student-card" style="display:none;">
      <h2>Add a Student to My Section</h2>
      <div id="add-student-wrap"></div>
    </div>

    <div class="card">
      <h2>Students in My Section(s)</h2>
      <div id="students-wrap"></div>
    </div>

    <div id="enroll-section" style="display:none;">
      <div class="card">
        <h2>Enroll a Student in a Course</h2>
        <form id="enroll-form">
          <div class="form-grid">
            <div><label>Student</label><select name="student_id" id="enroll-student" required></select></div>
            <div><label>Course</label><select name="course_id" id="enroll-course" required></select></div>
            <div>
              <label>Semester</label>
              <select name="semester" required>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Fall">Fall</option>
              </select>
            </div>
            <div><label>Academic Year</label><input type="number" name="academic_year" value="2026" required></div>
          </div>
          <button type="submit" class="btn">Enroll Student</button>
        </form>
      </div>

      <div class="card">
        <h2>My Students' Enrollments</h2>
        <div id="enrollments-wrap"></div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/advisor-dashboard.js"></script>
</body>
</html>
