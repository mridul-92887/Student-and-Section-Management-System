<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box" style="max-width:440px;">
      <h1>Create an Account</h1>
      <p class="subtitle">Your request will be reviewed by an admin before you can log in.</p>

      <div id="flash-container"></div>

      <form id="register-form">
        <label for="role">I am a...</label>
        <select id="role" name="role" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="advisor">Advisor</option>
          <option value="admin">Admin</option>
        </select>
        <br><br>

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>
        <br><br>

        <label for="login_id">ID</label>
        <input type="text" id="login_id" name="login_id" placeholder="e.g. 242-15-001" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="e.g. yourname242-15-001@diu.edu.bd" required>
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required>
        <br><br>

        <label for="confirm_password">Re-enter Password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>

        <button type="submit" class="btn">Submit Request</button>
      </form>

      
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        role: form.role.value,
        full_name: form.full_name.value,
        login_id: form.login_id.value,
        email: form.email.value,
        password: form.password.value,
        confirm_password: form.confirm_password.value
      };
      const { data } = await api('/auth/register', { method: 'POST', body });
      if (data.success) {
        window.location.href = '/login.html';
      } else {
        flash('error', data.message);
      }
    });
  </script>
</body>
</html>
