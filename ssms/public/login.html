<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SSMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>Student &amp; Section Management System</h1>
      <p class="subtitle">Sign in with your ID, email, and password</p>

      <div id="flash-container"></div>

      <form id="login-form">
        <label for="login_id">ID</label>
        <input type="text" id="login_id" name="login_id" placeholder="e.g. 242-15-001" required autofocus>
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="e.g. yourname242-15-001@diu.edu.bd" required>
        <br><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn">Log In</button>
      </form>

     
      <p style="text-align:center; margin-top:14px; font-size:0.9rem;">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        login_id: form.login_id.value,
        email: form.email.value,
        password: form.password.value
      };
      const { data } = await api('/auth/login', { method: 'POST', body });
      if (data.success) {
        window.location.href = data.redirect;
      } else {
        flash('error', data.message);
      }
    });
  </script>
</body>
</html>
